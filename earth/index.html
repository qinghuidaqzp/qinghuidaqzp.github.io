<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>全息地球 - 真实大陆版</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', monospace; user-select: none; }
        
        /* 视频窗口 */
        #video-container {
            position: absolute; bottom: 20px; right: 20px;
            width: 200px; height: 150px;
            border: 1px solid #333; z-index: 10;
            transform: scaleX(-1); opacity: 0.4;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* UI 顶部栏 */
        #ui-header {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 20px; pointer-events: none; z-index: 20;
            display: flex; justify-content: space-between;
            box-sizing: border-box;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
        }
        
        .panel { padding: 0 15px; }
        .panel-left { border-left: 4px solid #00ffff; color: #00ffff; text-shadow: 0 0 10px #00ffff; }
        .panel-right { border-right: 4px solid #ffaa00; color: #ffaa00; text-shadow: 0 0 10px #ffaa00; text-align: right; }

        h2 { margin: 0; font-size: 18px; letter-spacing: 2px; }
        p { margin: 5px 0 0 0; font-size: 12px; opacity: 0.8; }

        /* 左手光标 (十字准心) */
        #cursor-left {
            position: absolute; width: 40px; height: 40px;
            border: 1px solid rgba(0,255,255,0.5); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 30; display: none;
        }
        #cursor-left::before, #cursor-left::after {
            content: ''; position: absolute; background: #00ffff;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        #cursor-left::before { width: 100%; height: 1px; } /* 横线 */
        #cursor-left::after { width: 1px; height: 100%; } /* 竖线 */

        /* 右手光标 (控制框) */
        #cursor-right {
            position: absolute; width: 60px; height: 60px;
            border: 2px dashed #ffaa00; border-radius: 8px;
            transform: translate(-50%, -50%) rotate(45deg); pointer-events: none; z-index: 30; display: none;
        }

        /* 提示框 */
        #tooltip {
            position: absolute; display: none;
            background: rgba(0, 15, 30, 0.95); border: 1px solid #00ffff;
            color: #fff; padding: 10px 15px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            white-space: nowrap; z-index: 40;
        }
        
        /* 加载提示 */
        #loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            color: #00ffff; font-size: 14px; text-align: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</head>
<body>

    <div id="loader">正在下载卫星数据...<br><span style="font-size:10px; opacity:0.6">(如果长时间未显示，请检查网络)</span></div>

    <div id="ui-header">
        <div class="panel panel-left">
            <h2>LEFT HAND [SCAN]</h2>
            <p>状态: <span id="status-left">等待左手...</span></p>
        </div>
        <div class="panel panel-right">
            <h2>RIGHT HAND [CTRL]</h2>
            <p>状态: <span id="status-right">等待右手...</span></p>
        </div>
    </div>

    <div id="cursor-left"></div>
    <div id="cursor-right"></div>
    <div id="tooltip"></div>
    <div id="video-container"><video class="input_video"></video></div>

<script>
    // ==================== 1. 场景初始化 ====================
    const scene = new THREE.Scene();
    // 稍微亮一点的雾气
    scene.fog = new THREE.FogExp2(0x000000, 0.015);

    let cameraDistance = 3.8;
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = cameraDistance;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const earthGroup = new THREE.Group();
    scene.add(earthGroup);

    // ==================== 2. 核心：加载真实纹理 ====================
    const textureLoader = new THREE.TextureLoader();
    textureLoader.setCrossOrigin('anonymous'); // 允许跨域

    // --- 在这里定义纹理 URL ---
    // 方案 A: Wikimedia (通常比较稳)
    const mapUrl = 'earth.jpg';
    // 方案 B: 如果上面那个挂了，可以手动改成本地图片 'earth.jpg'
    
    // 创建基础球体几何
    const geometry = new THREE.SphereGeometry(1, 64, 64);

    textureLoader.load(
        mapUrl, 
        // 成功回调
        function(texture) {
            document.getElementById('loader').style.display = 'none';
            
            // 全息风格材质：使用纹理作为发光贴图
            const material = new THREE.MeshPhongMaterial({
                map: texture,           // 基础颜色
                emissive: 0x0044aa,     // 整体泛蓝光
                emissiveMap: texture,   // 让大陆部分发光更亮
                emissiveIntensity: 0.6, // 发光强度
                shininess: 5,
                transparent: true,
                opacity: 0.95           // 稍微透一点点
            });
            const earthMesh = new THREE.Mesh(geometry, material);
            earthGroup.add(earthMesh);

            // 加一层线框，增加科技感
            const wireMesh = new THREE.Mesh(
                geometry,
                new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.05 })
            );
            wireMesh.scale.set(1.01, 1.01, 1.01);
            earthGroup.add(wireMesh);
        },
        // 进度回调
        undefined,
        // 失败回调 (兜底方案)
        function(err) {
            console.error("图片加载失败，切换到备用模式");
            document.getElementById('loader').innerText = "纹理下载失败 - 已启用备用线框模式";
            setTimeout(() => document.getElementById('loader').style.display = 'none', 2000);

            // 创建一个没有图片的蓝色线框球
            const fallbackMat = new THREE.MeshBasicMaterial({ color: 0x0066ff, wireframe: true });
            const fallbackMesh = new THREE.Mesh(geometry, fallbackMat);
            earthGroup.add(fallbackMesh);
        }
    );

    // 大气层光晕
    const atmoMat = new THREE.ShaderMaterial({
        uniforms: { viewVector: { type: "v3", value: camera.position } },
        vertexShader: `
            uniform vec3 viewVector;
            varying float intensity;
            void main() {
                gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
                vec3 actual_normal = normalize(normalMatrix * normal);
                intensity = pow( 0.65 - dot(actual_normal, vec3(0, 0, 1.0)), 4.0 ); 
            }
        `,
        fragmentShader: `varying float intensity; void main() { gl_FragColor = vec4(0.0, 0.6, 1.0, intensity * 0.8); }`,
        side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true
    });
    const atmo = new THREE.Mesh(new THREE.SphereGeometry(1.2, 64, 64), atmoMat);
    scene.add(atmo);

    // 星空
    const starGeo = new THREE.BufferGeometry();
    const starPos = [];
    for(let i=0; i<2000; i++) starPos.push((Math.random()-0.5)*100, (Math.random()-0.5)*100, (Math.random()-0.5)*100);
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xaaaaaa, size:0.04})));

    // 灯光
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
    sunLight.position.set(5, 3, 5);
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0x222222));


    // ==================== 3. 城市标记 ====================
    const cities = [
        { name: "中国·北京", lat: 39.9042, lon: 116.4074 },
        { name: "中国·上海", lat: 31.2304, lon: 121.4737 },
        { name: "日本·东京", lat: 35.6762, lon: 139.6503 },
        { name: "美国·纽约", lat: 40.7128, lon: -74.0060 },
        { name: "英国·伦敦", lat: 51.5074, lon: -0.1278 },
        { name: "法国·巴黎", lat: 48.8566, lon: 2.3522 },
        { name: "澳大利亚·悉尼", lat: -33.8688, lon: 151.2093 },
        { name: "俄罗斯·莫斯科", lat: 55.7558, lon: 37.6173 },
        { name: "埃及·开罗", lat: 30.0444, lon: 31.2357 },
        { name: "巴西·里约", lat: -22.9068, lon: -43.1729 },
        { name: "南极站", lat: -80.0, lon: 0.0 }
    ];

    const markerGroup = new THREE.Group();
    earthGroup.add(markerGroup);

    function latLonToVector3(lat, lon, radius) {
        const phi = (90 - lat) * (Math.PI / 180);
        const theta = (lon + 180) * (Math.PI / 180);
        const x = -(radius * Math.sin(phi) * Math.cos(theta));
        const z = (radius * Math.sin(phi) * Math.sin(theta));
        const y = (radius * Math.cos(phi));
        return new THREE.Vector3(x, y, z);
    }

    cities.forEach(city => {
        const pos = latLonToVector3(city.lat, city.lon, 1.0);
        
        // 红点
        const pin = new THREE.Mesh(
            new THREE.SphereGeometry(0.015, 16, 16), 
            new THREE.MeshBasicMaterial({ color: 0xff0055 })
        );
        pin.position.copy(pos);
        pin.userData = city;
        
        // 碰撞体积
        const hit = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshBasicMaterial({visible:false}));
        pin.add(hit);

        // 装饰圈
        const ring = new THREE.Mesh(new THREE.RingGeometry(0.025, 0.03, 32), new THREE.MeshBasicMaterial({color:0xff0055, side:THREE.DoubleSide}));
        ring.position.copy(pos);
        ring.lookAt(0,0,0);
        earthGroup.add(ring);

        markerGroup.add(pin);
    });


    // ==================== 4. 双手交互 ====================
    const statusLeft = document.getElementById('status-left');
    const statusRight = document.getElementById('status-right');
    const cursorLeft = document.getElementById('cursor-left');
    const cursorRight = document.getElementById('cursor-right');
    const tooltip = document.getElementById('tooltip');

    let targetRotY = 0, targetRotX = 0, targetZoom = 3.8;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function onResults(results) {
        let leftHand, rightHand;
        if (results.multiHandLandmarks && results.multiHandedness) {
            for (let i = 0; i < results.multiHandedness.length; i++) {
                const label = results.multiHandedness[i].label;
                if (label === 'Left') leftHand = results.multiHandLandmarks[i];
                if (label === 'Right') rightHand = results.multiHandLandmarks[i];
            }
        }

        // --- 左手：扫描地名 ---
        if (leftHand) {
            statusLeft.innerText = "已激活 (扫描中)"; statusLeft.style.color = "#00ffff";
            const index = leftHand[8];
            const x = (1 - index.x) * window.innerWidth;
            const y = index.y * window.innerHeight;

            cursorLeft.style.display = 'block';
            cursorLeft.style.left = x + 'px';
            cursorLeft.style.top = y + 'px';

            mouse.x = ((1 - index.x) * 2) - 1;
            mouse.y = -(index.y * 2) + 1;
            raycaster.setFromCamera(mouse, camera);

            // 递归检测 markerGroup 的子对象 (hit box)
            const intersects = raycaster.intersectObjects(markerGroup.children, true);
            let hit = false;
            
            if (intersects.length > 0) {
                // 向上找带有 name 数据的 Mesh
                let obj = intersects[0].object;
                while(obj && !obj.userData.name && obj.parent) { obj = obj.parent; }

                if (obj && obj.userData.name) {
                    hit = true;
                    tooltip.style.display = 'block';
                    tooltip.style.left = (x+25) + 'px';
                    tooltip.style.top = (y+25) + 'px';
                    tooltip.innerHTML = `<b style="color:#00ffff; font-size:16px;">${obj.userData.name}</b><br><span style="font-size:12px; color:#aaa">LAT: ${obj.userData.lat}</span>`;
                    
                    cursorLeft.style.borderColor = "#ff0055"; // 瞄准变红
                }
            }
            if(!hit) {
                tooltip.style.display = 'none';
                cursorLeft.style.borderColor = "rgba(0,255,255,0.5)";
            }
        } else {
            statusLeft.innerText = "等待左手..."; statusLeft.style.color = "#555";
            cursorLeft.style.display = 'none'; tooltip.style.display = 'none';
        }

        // --- 右手：旋转 & 缩放 ---
        if (rightHand) {
            statusRight.innerText = "已激活 (控制中)"; statusRight.style.color = "#ffaa00";
            const wrist = rightHand[0];
            const thumb = rightHand[4];
            const index = rightHand[8];

            // 1. 光标
            const cx = (1 - wrist.x) * window.innerWidth;
            const cy = wrist.y * window.innerHeight;
            cursorRight.style.display = 'block';
            cursorRight.style.left = cx + 'px';
            cursorRight.style.top = cy + 'px';

            // 2. 旋转 (基于手掌位置)
            // x: -1(左) ~ 1(右), y: -1(上) ~ 1(下)
            const xOffset = (wrist.x - 0.5) * 4; 
            const yOffset = (wrist.y - 0.5) * 2;
            targetRotY = xOffset;
            targetRotX = yOffset;

            // 3. 缩放 (基于捏合)
            const dist = Math.hypot(index.x - thumb.x, index.y - thumb.y);
            const clampDist = Math.max(0.02, Math.min(0.25, dist));
            // 捏合(0.02) -> 远(5.5), 张开(0.25) -> 近(2.0)
            targetZoom = 5.5 - ((clampDist - 0.02) / 0.23) * 3.5;

            // 光标动画
            cursorRight.style.width = cursorRight.style.height = (40 + clampDist*200) + 'px';

        } else {
            statusRight.innerText = "等待右手..."; statusRight.style.color = "#555";
            cursorRight.style.display = 'none';
            targetRotY += 0.002; // 没人控制时自转
        }
    }

    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
    hands.onResults(onResults);

    new Camera(document.getElementsByClassName('input_video')[0], {
        onFrame: async () => { await hands.send({image: document.getElementsByClassName('input_video')[0]}); },
        width: 640, height: 480
    }).start();

    // 动画循环
    function animate() {
        requestAnimationFrame(animate);
        // 平滑运动
        earthGroup.rotation.y += (targetRotY - earthGroup.rotation.y) * 0.08;
        earthGroup.rotation.x += (targetRotX - earthGroup.rotation.x) * 0.08;
        cameraDistance += (targetZoom - cameraDistance) * 0.1;
        camera.position.z = cameraDistance;

        atmo.material.uniforms.viewVector.value = camera.position;
        renderer.render(scene, camera);
    }
    animate();
    
    window.onresize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    };
</script>
</body>
</html>
