<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QZP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Long+Cang&family=Ma+Shan+Zheng&family=Permanent+Marker&display=swap">
<!-- 博客同一套液态玻璃：流动背景 + 折射玻璃（带 data-lg 的元素） -->
<link rel="stylesheet" href="/css/liquid-glass.css">
<!-- 封面、唱片架、海报墙共用：珍珠背景、玻璃导航和滑块、提示条 -->
<link rel="stylesheet" href="/css/glass-pages.css">
<link rel="modulepreload" href="/vendor/liquid-glass/displacement-map.js">
<link rel="modulepreload" href="/vendor/liquid-glass/tokens.js">
<link rel="modulepreload" href="/vendor/liquid-glass/capabilities.js">
<script type="module" src="/js/liquid-glass.js"></script>
<style>
  /* 首页（封面）：拼贴物件目前是 CSS 画的占位，之后换成抠图 PNG。 */
  :root {
    --hand: 'Long Cang', 'Permanent Marker', cursive;
    --shadow: drop-shadow(0 12px 18px rgba(40, 40, 80, .16)) drop-shadow(0 2px 4px rgba(40, 40, 80, .12));
    --shadow-lift: drop-shadow(0 22px 30px rgba(40, 40, 80, .22)) drop-shadow(0 4px 8px rgba(40, 40, 80, .14));
  }
  body { overflow: hidden; }

  /* 背景：拍的一大片积云（裁掉了顶部的哈苏水印），慢慢推镜。
     想换回珍珠流动色块：#web_bg 改回 class="pearl-bg"，里面放 <canvas class="pearl-flow"> */
  #web_bg.has-photo { background: #2c5a93 !important; overflow: hidden; }
  #web_bg.has-photo::before, #web_bg.has-photo::after { display: none !important; }
  /* 原图 5184px 裁出来三份（都轻微锐化）：竖屏手机用以塔为中心的竖图（1200×2400），
     横屏用 2560，高分屏和大屏用 3840，屏幕上不会把图拉大 */
  .photo-bg {
    position: absolute; inset: -3%;
    background: url(/img/bg/sky-portrait.webp) 48% 50% / cover no-repeat;
    animation: ken-burns 70s ease-in-out infinite alternate;
    will-change: transform;
  }
  @media (min-aspect-ratio: 4/5) { .photo-bg { background-image: url(/img/bg/sky-2560.webp); background-position: 50% 60%; } }
  @media (min-aspect-ratio: 4/5) and (min-width: 1900px), (min-aspect-ratio: 4/5) and (min-width: 1000px) and (min-resolution: 1.25dppx) {
    .photo-bg { background-image: url(/img/bg/sky-3840.webp); }
  }
  @keyframes ken-burns { from { transform: scale(1); } to { transform: scale(1.06) translate(-1%, -.6%); } }
  @media (prefers-reduced-motion: reduce) { .photo-bg { animation: none; } }
  /* 照片很亮：导航用深色玻璃 + 白字；着色深浅（--tint-a）由脚本按身后照片的亮度调 */
  .topbar { --ink: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .34); }
  .topbar.lg-surface[data-lg-kind='nav'] { --lg-tint: rgba(20, 22, 32, var(--tint-a, .12)); --lgos-border: rgba(255, 255, 255, .3); }
  .topbar .seg:not(.is-current) { opacity: .72; }
  .topbar .seg:not(.is-current):hover { opacity: 1; }

  /* 中间的名字 */
  .hero {
    position: absolute; left: 50%; top: 46%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 1;
  }
  .hello {
    margin: 0 0 -.1em;
    font-family: var(--hand); font-size: clamp(26px, 3vw, 40px);
    transform: rotate(-4deg); display: inline-block;
    animation: fade-up .9s var(--ease) .1s backwards;
  }
  .hello svg { display: block; width: 100%; height: 12px; margin-top: -4px; }
  .name {
    margin: 0;
    font-family: 'Anton', sans-serif; font-weight: 400;
    font-size: clamp(120px, 19vw, 300px); line-height: .92; letter-spacing: .02em;
    color: var(--ink);
    animation: pop .9s var(--ease) .2s backwards;
  }
  .tagline {
    margin: .3em 0 0;
    font-family: var(--hand); font-size: clamp(20px, 2vw, 28px); color: var(--ink);
    text-shadow: 0 0 2px rgba(255, 255, 255, .9), 0 0 12px rgba(255, 255, 255, .8); /* 压在云和蓝天上也看得清 */
    animation: fade-up .9s var(--ease) .35s backwards;
  }

  /* 拼贴物件：位置用 left/top，拖动改 --dx/--dy */
  .obj {
    position: absolute; z-index: 5;
    width: var(--w);
    padding: 0; border: 0; background: none; color: inherit; font: inherit; text-decoration: none;
    cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-user-drag: none;
    transform-origin: top left;
    transform: translate(var(--dx, 0px), var(--dy, 0px)) rotate(var(--r, 0deg)) scale(var(--k, 1));
    -webkit-tap-highlight-color: transparent;
  }
  .obj:focus-visible { outline: 2px solid #2f8cff; outline-offset: 6px; border-radius: 6px; }
  .obj .inner {
    position: relative; display: block;
    filter: var(--shadow);
    transition: transform .4s var(--ease), filter .4s var(--ease);
    animation: drop .9s var(--ease) backwards;
    animation-delay: calc(var(--i) * 90ms + 300ms);
  }
  .obj.is-dragging { cursor: grabbing; }
  .obj.is-dragging .inner { transform: scale(1.07); filter: var(--shadow-lift); }
  @media (hover: hover) {
    .obj:hover .inner { transform: scale(1.05) rotate(calc(var(--r, 0deg) * -.35)); filter: var(--shadow-lift); }
  }
  .obj[data-tip]::after {
    content: attr(data-tip);
    position: absolute; left: 50%; top: 100%; margin-top: 14px;
    transform: translateX(-50%) rotate(calc(var(--r, 0deg) * -1)) translateY(-4px);
    padding: 6px 12px; border-radius: 999px;
    font-size: 13px; white-space: nowrap; color: var(--ink);
    background: rgba(255, 255, 255, .7);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .7), 0 6px 16px rgba(40, 40, 80, .12);
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .3s var(--ease);
  }
  @media (hover: hover) {
    .obj:hover::after { opacity: 1; transform: translateX(-50%) rotate(calc(var(--r, 0deg) * -1)); }
  }
  .obj.is-dragging::after { opacity: 0 !important; }

  /* BETTER CALL ME 贴纸：博客的入口，点一下进博客 */
  .saul { left: 7%; top: 14%; --w: 150px; --r: -8deg; --i: 0; }
  .saul .card {
    display: block; padding: 18px 14px 14px;
    background: #eeb928; border-radius: 3px;
    text-align: left;
  }
  .saul .big { display: block; font-family: 'Anton', sans-serif; font-size: 36px; line-height: .88; color: #fff; text-shadow: 2px 2px 0 rgba(0, 0, 0, .18); }
  .saul .small { display: block; margin-top: 8px; font-family: 'Permanent Marker', cursive; font-size: 11px; color: rgba(255, 255, 255, .9); }
  .tape {
    position: absolute; top: -10px; left: 50%; width: 64px; height: 20px;
    transform: translateX(-50%) rotate(-5deg);
    background: rgba(255, 255, 255, .55);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .08);
  }

  /* 书 */
  .book { left: 27%; top: 11%; --w: 112px; --r: -5deg; --i: 1; }
  .book .cover {
    position: relative; display: block; height: 156px;
    border-radius: 3px 6px 6px 3px;
    background: linear-gradient(90deg, #1f3a30 0 12px, #2f5546 12px 14px, #355f4e 14px);
    box-shadow: 3px 3px 0 #f4f0e4, 5px 5px 0 #d9d2c0;
    color: #f4efe2; padding: 22px 12px 0 24px;
  }
  .book .t { display: block; font-family: 'Ma Shan Zheng', serif; font-size: 34px; line-height: 1; }
  .book .s { display: block; margin-top: 10px; font-size: 9px; letter-spacing: .3em; opacity: .7; }

  /* 黑胶唱片 + 封套 */
  .record { right: 6%; top: 11%; --w: 250px; --r: 6deg; --i: 2; }
  .record .inner { height: 180px; }
  .vinyl {
    position: absolute; left: 70px; top: 6px; width: 168px; height: 168px; border-radius: 50%;
    background:
      radial-gradient(circle, #f7d3dd 0 17%, #1a1a1a 17.5% 19%, transparent 19.5%),
      repeating-radial-gradient(circle, #141414 0 2px, #222 2px 3px);
    box-shadow: inset 0 0 0 2px #0c0c0c;
  }
  .vinyl::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 30deg, transparent 0 12%, rgba(255, 255, 255, .14) 16%, transparent 22% 62%, rgba(255, 255, 255, .1) 66%, transparent 72%);
  }
  .sleeve {
    position: absolute; left: 0; top: 0; width: 180px; height: 180px; border-radius: 3px;
    background: linear-gradient(140deg, #ffb3c7 0%, #ffcf9f 55%, #ffe9a8 100%);
    padding: 16px; text-align: left;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .5);
  }
  .sleeve .t { display: block; font-family: 'Permanent Marker', cursive; font-size: 22px; line-height: 1.05; color: #7a2840; }
  .sleeve .s { position: absolute; left: 16px; bottom: 14px; font-size: 11px; letter-spacing: .2em; color: rgba(122, 40, 64, .7); }

  /* 手稿《断纱》 */
  .manuscript { left: 5%; top: 47%; --w: 190px; --r: 5deg; --i: 3; }
  .manuscript .inner { height: 240px; }
  .sheet {
    position: absolute; inset: 0; border-radius: 3px; background: #fbf8f0;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .08);
  }
  .sheet.s2 { transform: rotate(4deg); background: #f4efe3; }
  .sheet.s3 { transform: rotate(-3deg); background: #f8f4ea; }
  .sheet.top {
    padding: 28px 18px 0 36px; text-align: left;
    background:
      linear-gradient(90deg, transparent 26px, rgba(220, 80, 80, .35) 26px 27px, transparent 27px),
      repeating-linear-gradient(transparent 0 23px, rgba(80, 120, 200, .16) 23px 24px),
      #fdfbf6;
  }
  .sheet .t { display: block; font-family: 'Ma Shan Zheng', serif; font-size: 46px; line-height: 1; color: #2a2a33; }
  .sheet .l { display: block; margin-top: 12px; font-family: var(--hand); font-size: 17px; line-height: 24px; color: #555; }
  .clip {
    position: absolute; left: 22px; top: -16px; width: 18px; height: 56px;
    border: 3px solid #9aa3ad; border-radius: 10px;
  }
  .clip::after {
    content: ''; position: absolute; left: 2px; top: 8px; width: 8px; height: 34px;
    border: 3px solid #9aa3ad; border-top: 0; border-radius: 0 0 8px 8px;
  }

  /* 拍立得：真正的占位 */
  .polaroid { left: 22%; top: 63%; --w: 168px; --r: -6deg; --i: 4; }
  .polaroid .frame { display: block; padding: 10px 10px 40px; background: #fff; border-radius: 2px; }
  .polaroid .photo { /* 2025 年拍的日落（tools/bg-photo.js 那张的正方形裁切） */
    display: block; aspect-ratio: 1; border-radius: 1px;
    background: #2a2a33 url(/img/bg/sunset-square.webp) center / cover no-repeat;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .06);
  }
  .polaroid .cap { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-family: var(--hand); font-size: 20px; color: #444; }

  /* 电影票根 */
  .ticket { right: 25%; top: 66%; --w: 214px; --r: 9deg; --i: 5; }
  .ticket .body {
    display: flex; height: 92px; border-radius: 4px; overflow: hidden;
    background: #b3261e; color: #fbecd6;
    -webkit-mask: radial-gradient(circle at 0 50%, transparent 10px, #000 10.5px) left / 51% 100% no-repeat,
                  radial-gradient(circle at 100% 50%, transparent 10px, #000 10.5px) right / 51% 100% no-repeat;
            mask: radial-gradient(circle at 0 50%, transparent 10px, #000 10.5px) left / 51% 100% no-repeat,
                  radial-gradient(circle at 100% 50%, transparent 10px, #000 10.5px) right / 51% 100% no-repeat;
  }
  .ticket .main { flex: 1; padding: 14px 10px 0 22px; text-align: left; }
  .ticket .main b { display: block; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 26px; letter-spacing: .12em; }
  .ticket .main span { font-family: var(--hand); font-size: 17px; }
  .ticket .stub {
    width: 58px; border-left: 2px dashed rgba(251, 236, 214, .55);
    display: grid; place-items: center;
    font-family: 'Anton', sans-serif; font-size: 12px; letter-spacing: .15em;
    writing-mode: vertical-rl;
  }

  /* 地球仪：用全息地球页的贴图，横向滚动当作自转 */
  .globe { right: 7%; top: 44%; --w: 180px; --r: 0deg; --i: 6; }
  .globe .inner { height: 230px; }
  .sphere {
    position: absolute; left: 15px; top: 10px; width: 150px; height: 150px; border-radius: 50%;
    background: url(/earth/earth.jpg) 0 0 / 300px 150px repeat-x;
    animation: globe-turn 24s linear infinite;
    box-shadow: inset -22px -18px 38px rgba(0, 0, 40, .55), inset 10px 8px 22px rgba(255, 255, 255, .25);
  }
  .sphere::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .45), transparent 38%);
  }
  .arc {
    position: absolute; left: 3px; top: -2px; width: 174px; height: 174px; border-radius: 50%;
    border: 4px solid #b8955a; border-left-color: transparent; border-bottom-color: transparent;
    transform: rotate(20deg);
  }
  .stem { position: absolute; left: 84px; top: 168px; width: 12px; height: 32px; background: linear-gradient(90deg, #8d6c38, #c9a76a, #8d6c38); }
  .base { position: absolute; left: 40px; top: 196px; width: 100px; height: 22px; border-radius: 50%; background: radial-gradient(ellipse at 50% 35%, #d4b37a, #8d6c38); }

  /* Dock：一整块液态玻璃（data-lg="dock"），几乎不着色（LGOS 默认 8% 白）。
     底板宽度固定，鼠标附近的图标按余弦曲线连续放大、挤开邻居（左右内边距留出挤开的空间）。
     下面的 background / backdrop-filter / box-shadow 只在引擎没加载时生效 */
  .dock {
    position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 40;
    transform: translateX(-50%);
    padding: 10px 26px;
    border-radius: 26px;
    background: rgba(255, 255, 255, .08);
    -webkit-backdrop-filter: blur(2.8px) saturate(160%);
    backdrop-filter: blur(2.8px) saturate(160%);
    box-shadow:
      inset 1.5px -1.5px 1px -1px rgba(255, 255, 255, .92),
      inset -1.5px 1.5px 1px -1px rgba(255, 255, 255, .9),
      inset 0 0 3px rgba(15, 23, 42, .35),
      0 16px 32px rgba(15, 23, 42, .14);
    animation: dock-in .8s var(--ease) .9s backwards;
  }
  /* 更浅更透：几乎不着色，内阴影、内圈光晕改成白的（引擎默认是深灰，会让底板发灰），投影也减轻；再把身后提亮一点 */
  .dock.lg-surface[data-lg-kind='dock'] {
    --lg-tint: rgba(255, 255, 255, .03);
    --lgos-shade: rgba(15, 23, 42, .04);
    --lgos-ring: rgba(255, 255, 255, .22);
    --lgos-border: rgba(255, 255, 255, .55);
    --lgos-drop: 0 8px 22px rgba(15, 23, 42, .06), 0 1px 4px rgba(15, 23, 42, .04);
  }
  .dock.lg-surface.is-glass > .lg-optical-layer {
    -webkit-backdrop-filter: var(--lg-filter) brightness(1.06) !important;
    backdrop-filter: var(--lg-filter) brightness(1.06) !important;
  }
  .dock-row { display: flex; align-items: flex-end; gap: 10px; }
  .dock-item { position: relative; display: block; transform: translateX(var(--x, 0px)); -webkit-tap-highlight-color: transparent; }
  /* 透明图标：不填色，只留 LGOS 的对角高光和一点内阴影 */
  .dock-item .tile {
    display: grid; place-items: center;
    width: 48px; height: 48px; border-radius: 13px;
    transform: scale(var(--s, 1)); transform-origin: 50% 100%;
    transition: background .2s;
    background: rgba(255, 255, 255, .04);
    box-shadow:
      inset 1.5px -1.5px 1px -1px rgba(255, 255, 255, .92),
      inset -1.5px 1.5px 1px -1px rgba(255, 255, 255, .9),
      inset 0 0 3px rgba(15, 23, 42, .08);
  }
  .dock-item:active .tile { background: rgba(255, 255, 255, .24); }
  .dock-item svg { width: 60%; height: 60%; color: rgba(17, 24, 39, .85); filter: drop-shadow(0 1px 0 rgba(255, 255, 255, .7)); overflow: visible; }
  .dock-item::after {
    content: attr(data-label);
    position: absolute; left: 50%; bottom: calc(100% + var(--tip, 0px) + 12px);
    transform: translateX(-50%) translateY(4px);
    padding: 5px 11px; border-radius: 999px;
    font-size: 12px; white-space: nowrap; color: var(--ink);
    background: rgba(255, 255, 255, .75);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: 0 4px 12px rgba(40, 40, 80, .14);
    opacity: 0; pointer-events: none;
    transition: opacity .15s, transform .2s var(--ease);
  }
  @media (hover: hover) {
    .dock-item:hover::after { opacity: 1; transform: translateX(-50%); }
  }
  .dock-sep { align-self: center; width: 1px; height: 34px; background: rgba(17, 24, 39, .14); transform: translateX(var(--x, 0px)); }

  @keyframes drop { from { opacity: 0; transform: translateY(-36px) scale(.9); } }
  @keyframes pop { from { opacity: 0; transform: scale(.92); } }
  @keyframes fade-up { from { opacity: 0; transform: translateY(12px); } }
  @keyframes dock-in { from { opacity: 0; transform: translate(-50%, 90px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes globe-turn { to { background-position: -300px 0; } }

  /* 手机：物件缩小、换位置，Dock 少放两个 */
  @media (max-width: 640px) {
    .dock .hide-sm { display: none; }
    .hero { top: 45%; width: 100%; }
    .name { font-size: 31vw; }
    .obj { --k: .6; }
    .saul { left: 4%; top: 9%; }
    .book { left: 5%; top: 27%; }
    .record { left: auto; right: -4%; top: 10%; }
    .manuscript { left: 3%; top: 58%; }
    .polaroid { left: 36%; top: 65%; }
    .ticket { right: auto; left: 4%; top: 82%; --r: -4deg; }
    .globe { right: 2%; top: 56%; }
    .dock { padding: 9px 14px; border-radius: 22px; }
    .dock-row { gap: 8px; }
    .dock-item .tile { width: 42px; height: 42px; border-radius: 12px; }
  }
</style>
</head>
<body>
<div id="web_bg" class="has-photo" data-no-flow aria-hidden="true"><div class="photo-bg"></div></div>

<nav class="topbar" data-lg="nav" aria-label="主导航">
  <a class="brand" href="/">QZP</a>
  <div class="seg-track">
    <a class="seg is-current" href="/" aria-current="page">首页</a>
    <a class="seg" href="/blog/">博客</a>
    <a class="seg" href="/categories/小说/">小说</a>
    <a class="seg" href="/records/">唱片</a>
    <a class="seg" href="/posters/">电影</a>
    <a class="seg" href="/bookshelf/">书籍</a>
    <span class="seg-indicator" aria-hidden="true"></span>
  </div>
</nav>


<section class="hero">
  <p class="hello">你好，我是
    <svg viewBox="0 0 120 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 8 C 30 2, 70 2, 118 7" fill="none" stroke="#1b1b22" stroke-width="2.5" stroke-linecap="round"/></svg>
  </p>
  <h1 class="name">QZP</h1>
  <p class="tagline">写小说 · 听歌 · 看电影</p>
</section>

<a class="obj saul" href="/blog/" draggable="false" data-tip="进入博客">
  <span class="inner"><span class="card"><span class="big">BETTER<br>CALL<br>ME</span><span class="small">LAWYER UP • STREET • FREEDOM</span></span><span class="tape"></span></span>
</a>

<a class="obj book" href="/bookshelf/" draggable="false" data-tip="书籍">
  <span class="inner"><span class="cover"><span class="t">书籍</span><span class="s">BOOKS</span></span></span>
</a>

<a class="obj record" href="/records/" draggable="false" data-tip="去唱片架">
  <span class="inner"><span class="vinyl"></span><span class="sleeve"><span class="t">My<br>Records</span><span class="s">唱片架</span></span></span>
</a>

<a class="obj manuscript" href="/categories/小说/" draggable="false" data-tip="读《断纱》">
  <span class="inner">
    <span class="sheet s2"></span><span class="sheet s3"></span>
    <span class="sheet top"><span class="t">断纱</span><span class="l">第一章<br>那年夏天，风是从……</span></span>
    <span class="clip"></span>
  </span>
</a>

<button class="obj polaroid" type="button" data-tip="2025 的日落" data-action="photo">
  <span class="inner"><span class="frame"><span class="photo" role="img" aria-label="2025 年拍的城市日落"></span></span><span class="cap">2025 的日落</span></span>
</button>

<a class="obj ticket" href="/posters/" draggable="false" data-tip="电影">
  <span class="inner"><span class="body"><span class="main"><b>ADMIT ONE</b><span>电影 · 我的片单</span></span><span class="stub">No.2026</span></span></span>

<script src="/js/glass-pages.js"></script>
<script>
(() => {
  const { say } = GlassPages;

  // 物件：拖动，没拖动才算点击
  let top = 10;
  document.querySelectorAll('.obj').forEach(el => {
    let id = null, sx = 0, sy = 0, ox = 0, oy = 0, moved = false;
    el.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      id = e.pointerId; sx = e.clientX; sy = e.clientY; moved = false;
      ox = parseFloat(el.style.getPropertyValue('--dx')) || 0;
      oy = parseFloat(el.style.getPropertyValue('--dy')) || 0;
      el.setPointerCapture(id);
      el.style.zIndex = ++top;
    });
    el.addEventListener('pointermove', e => {
      if (e.pointerId !== id) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (!moved && Math.hypot(dx, dy) < 5) return;
      moved = true;
      el.classList.add('is-dragging');
      el.style.setProperty('--dx', ox + dx + 'px');
      el.style.setProperty('--dy', oy + dy + 'px');
    });
    const end = e => {
      if (e.pointerId !== id) return;
      id = null;
      el.classList.remove('is-dragging');
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('click', e => {
      if (moved) { e.preventDefault(); moved = false; return; }
      const action = el.dataset.action;
      if (action === 'photo') {
        say('2025 年拍的日落');
      }
    });
  });

  document.querySelectorAll('.dock-item[href="#"]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    say(a.dataset.label + '：链接还没填');
  }));

  // Dock 放大：底板宽度不变，图标用 scale 放大、用 translateX 挤开邻居。
  // 每帧只写样式；间距、内边距这些布局数值只在初始化和窗口变化时读一次
  const row = document.querySelector('.dock-row');
  const fine = matchMedia('(hover: hover) and (pointer: fine)');
  const MAX = 1.5, SPREAD = 0.7; // 最多放大到 1.5 倍；多出来的宽度只挤开 70%，边上的图标就不会出界
  let parts = [], scales = [], mouse = null, raf = null, gap = 0, room = 0, rowWidth = 0;

  function measure() {
    const shown = [...row.children].filter(el => el.offsetWidth > 0);
    const origin = shown[0].offsetLeft; // offsetLeft 从 Dock 外框算起，减掉内边距
    parts = shown.map(el => ({
      el, sep: el.classList.contains('dock-sep'), left: el.offsetLeft - origin, w: el.offsetWidth
    }));
    gap = parseFloat(getComputedStyle(row).columnGap) || 0;
    room = parseFloat(getComputedStyle(row.parentElement).paddingLeft) - 4; // 两端各留 4px 不碰玻璃边缘
    rowWidth = row.offsetWidth;
    scales = parts.map(() => 1);
    mouse = null;
    apply();
  }
  function targets() {
    const range = (parts[0]?.w || 48) * 5;
    return parts.map(p => {
      if (mouse === null || p.sep) return 1;
      const d = (p.left + p.w / 2 - (mouse - range / 2)) / range;
      if (d < 0 || d > 1) return 1;
      return 1 + (1 - Math.cos(d * 2 * Math.PI)) / 2 * (MAX - 1);
    });
  }
  function apply() {
    let x = 0, rest = 0;
    const centers = parts.map((p, i) => {
      const w = p.w * (1 + (scales[i] - 1) * SPREAD);
      const c = x + w / 2;
      x += w + gap; rest += p.w + gap;
      return c;
    });
    // 整组居中挤开，碰到玻璃边缘就往回收
    const n = parts.length - 1;
    const hi = centers[0] - parts[0].w * scales[0] / 2 + room;
    const lo = centers[n] + parts[n].w * scales[n] / 2 - rowWidth - room;
    const shift = lo > hi ? (lo + hi) / 2 : Math.min(hi, Math.max(lo, (x - rest) / 2));
    parts.forEach((p, i) => {
      p.el.style.setProperty('--x', (centers[i] - shift - (p.left + p.w / 2)).toFixed(2) + 'px');
      if (p.sep) return;
      p.el.style.setProperty('--s', scales[i].toFixed(4));
      p.el.style.setProperty('--tip', ((scales[i] - 1) * p.w).toFixed(2) + 'px'); // 提示条跟着图标的顶边走
    });
  }
  // 每帧向目标靠近一点：移入快（0.2），移出慢（0.12）
  function tick() {
    const t = targets(), k = mouse === null ? 0.12 : 0.2;
    let moving = false;
    scales = scales.map((s, i) => {
      const v = s + (t[i] - s) * k;
      if (Math.abs(v - t[i]) > 0.003) { moving = true; return v; }
      return t[i];
    });
    apply();
    raf = moving ? requestAnimationFrame(tick) : null;
  }
  const kick = () => { raf ??= requestAnimationFrame(tick); };
  let rowLeft = 0;
  row.addEventListener('pointerenter', () => { rowLeft = row.getBoundingClientRect().left; });
  row.addEventListener('pointermove', e => {
    if (!fine.matches) return;
    mouse = e.clientX - rowLeft;
    kick();
  });
  row.addEventListener('pointerleave', () => { mouse = null; kick(); });
  addEventListener('resize', measure);
  document.fonts?.ready.then(measure);
  measure();

  // 导航按身后照片的亮度调着色（像 Apple 的 Liquid Glass）：压在白云上深一点，白字才看得清；
  // 压在蓝天上就几乎全透明。照片缩成 96px 宽读一次亮度，取导航身后 3×3 个点的平均；每半秒一次（背景在慢慢推镜）
  const photo = document.querySelector('.photo-bg');
  const glass = [
    { el: document.querySelector('.topbar'), lo: .06, hi: .22 },
  ].filter(g => g.el);
  let lum = null, lw = 0, lh = 0;

  function adapt() {
    if (!lum) return;
    const p = photo.getBoundingClientRect();
    const [px, py] = getComputedStyle(photo).backgroundPosition.split(' ').map(v => parseFloat(v) / 100);
    const s = Math.max(p.width / lw, p.height / lh); // background-size: cover
    const ox = p.left + (p.width - lw * s) * px, oy = p.top + (p.height - lh * s) * py;
    const at = (x, y) => {
      const u = Math.min(lw - 1, Math.max(0, (x - ox) / s | 0)), v = Math.min(lh - 1, Math.max(0, (y - oy) / s | 0));
      return lum[v * lw + u];
    };
    const rects = glass.map(g => g.el.offsetWidth ? g.el.getBoundingClientRect() : null);
    glass.forEach((g, i) => {
      const r = rects[i];
      if (!r) return;
      let sum = 0;
      for (const fy of [1 / 6, .5, 5 / 6]) for (const fx of [1 / 6, .5, 5 / 6]) sum += at(r.left + r.width * fx, r.top + r.height * fy);
      const t = Math.min(1, Math.max(0, (sum / 9 - .42) / .44)); // 亮度 .42 以下全透明，.86 以上最深
      const a = g.lo + (g.hi - g.lo) * t * t * (3 - 2 * t);
      if (g.a !== undefined && Math.abs(a - g.a) < .008) return;
      g.a = a;
      g.el.style.setProperty('--tint-a', a.toFixed(3));
    });
  }
  let lumSrc = '';
  function readPhoto() { // 转屏或窗口变宽变窄时背景可能换成另一张裁切，跟着重读
    const src = getComputedStyle(photo).backgroundImage.match(/url\("?(.*?)"?\)/)?.[1];
    if (!src || src === lumSrc) return adapt();
    lumSrc = src;
    const img = new Image();
    img.onload = () => {
      if (src !== lumSrc) return;
      lw = 96; lh = Math.round(96 * img.naturalHeight / img.naturalWidth);
      const c = Object.assign(document.createElement('canvas'), { width: lw, height: lh });
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, lw, lh);
      const d = ctx.getImageData(0, 0, lw, lh).data;
      lum = new Float32Array(lw * lh);
      for (let i = 0; i < lum.length; i++) lum[i] = (.2126 * d[i * 4] + .7152 * d[i * 4 + 1] + .0722 * d[i * 4 + 2]) / 255;
      adapt();
    };
    img.src = src;
  }
  readPhoto();
  setInterval(() => { if (!raf && !document.hidden) adapt(); }, 500);
  addEventListener('resize', () => requestAnimationFrame(readPhoto));

  setTimeout(() => say('物件可以拖动，点一下试试', 3200), 1400);
})();
</script>
